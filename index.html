                <button onclick="createTemplateChecklist('CAM')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700/50 text-xs px-3 py-1.5 rounded-md transition-colors text-slate-300">+ CAM</button>

  <script>
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let columns = [];
    let cards = [];
    let checklists = [];
    let checklistItems = [];
    let currentCardId = null;

    async function loadAllData() {
      const [colRes, cardRes, chkRes, itemRes] = await Promise.all([
        supabaseClient.from('kanban_columns').select('*').order('position'),
        supabaseClient.from('kanban_cards').select('*').order('position'),
        supabaseClient.from('card_checklists').select('*').order('position'),
        supabaseClient.from('checklist_items').select('*').order('position')
      ]);
      columns = colRes.data || [];
      cards = cardRes.data || [];
      checklists = chkRes.data || [];
      checklistItems = itemRes.data || [];
      renderBoard();
      if (currentCardId) openCardModal(currentCardId);
    }

    // Helper para gerar as tags "Pills" limpas
    function renderBadge(colorClass, text) {
      if (!text) return '';
      return `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-semibold uppercase tracking-wider border ${colorClass}">${text}</span>`;
    }

    function renderBoard() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const board = document.getElementById('boardContainer');
      board.innerHTML = '';

      columns.forEach(col => {
        const colCards = cards.filter(c => c.column_id === col.id && (
          c.title.toLowerCase().includes(search) ||
          (c.responsavel && c.responsavel.toLowerCase().includes(search))
        ));

        const colEl = document.createElement('div');
        colEl.className = 'bg-slate-800/60 backdrop-blur-md w-80 shrink-0 rounded-2xl p-3.5 flex flex-col max-h-full border border-slate-700/50 shadow-lg';
        colEl.innerHTML = `
          <div class="flex justify-between items-center px-1 mb-3">
            <h2 class="font-bold text-sm text-slate-200 tracking-wide">${col.title}</h2>
            <span class="bg-slate-700/50 text-slate-300 text-xs px-2 py-0.5 rounded-md font-semibold border border-slate-600/30">${colCards.length}</span>
          </div>
          <div class="card-list flex-1 overflow-y-auto space-y-3 pr-1 min-h-[50px] custom-scrollbar" data-col-id="${col.id}">
            ${colCards.map(card => renderCardFront(card)).join('')}
          </div>
          <button onclick="createNewCard('${col.id}')" class="mt-3 flex items-center gap-2 justify-center w-full text-sm text-slate-400 hover:text-slate-200 border border-dashed border-slate-600 hover:border-slate-400 hover:bg-slate-700/30 py-2 rounded-xl transition-all font-medium">
            <span>+</span> Novo Cartão
          </button>
        `;
        board.appendChild(colEl);

        new Sortable(colEl.querySelector('.card-list'), {
          group: 'kanban',
          animation: 200,
          ghostClass: 'opacity-40',
          dragClass: 'cursor-grabbing',
          onEnd: async (evt) => {
            const cardId = evt.item.dataset.cardId;
            const newColId = evt.to.dataset.colId;
            const oldColId = evt.from.dataset.colId;
            if (newColId !== oldColId) {
              const oldCol = columns.find(c => c.id === oldColId)?.title || '';
              const newCol = columns.find(c => c.id === newColId)?.title || '';
              await supabaseClient.from('kanban_cards').update({ column_id: newColId, position: evt.newIndex }).eq('id', cardId);
              await logActivity(cardId, `moveu este cartão de ${oldCol} para ${newCol}`);
              loadAllData();
            }
          }
        });
      });
    }

    function renderCardFront(card) {
      const cardChks = checklists.filter(ch => ch.card_id === card.id).map(ch => ch.id);
      const items = checklistItems.filter(i => cardChks.includes(i.checklist_id));
      const doneItems = items.filter(i => i.is_checked).length;

      let dueBadge = '';
      if (card.due_date) {
        const isLate = !card.is_completed && new Date(card.due_date) < new Date();
        const dateColor = card.is_completed ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' 
                          : isLate ? 'bg-red-500/10 text-red-400 border-red-500/20' 
                          : 'bg-amber-500/10 text-amber-400 border-amber-500/20';
        dueBadge = `
          <span class="${dateColor} border px-1.5 py-0.5 rounded flex items-center gap-1 text-[10px] font-semibold">
            🕒 ${new Date(card.due_date).toLocaleDateString('pt-BR', {day:'2-digit', month:'short'})}
          </span>`;
      }

      const chkBadge = items.length > 0 ? `
        <span class="${doneItems === items.length ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-slate-700/50 text-slate-300 border-slate-600/50'} border px-1.5 py-0.5 rounded flex items-center gap-1 text-[10px] font-semibold">
          ☑️ ${doneItems}/${items.length}
        </span>` : '';

      return `
        <div onclick="openCardModal('${card.id}')" data-card-id="${card.id}" 
          class="group bg-slate-800 hover:bg-slate-750 rounded-xl overflow-hidden cursor-grab active:cursor-grabbing border border-slate-700/60 shadow-sm hover:shadow-md hover:border-slate-500/50 transition-all">
          ${card.cover_image_url ? `
            <div class="h-28 w-full overflow-hidden bg-slate-900 relative">
              <img src="${card.cover_image_url}" class="w-full h-full object-cover opacity-80 group-hover:scale-105 transition-transform duration-500" />
            </div>
          ` : ''}
          <div class="p-3.5 space-y-3">
            <div class="text-sm font-semibold text-slate-100 leading-snug group-hover:text-brand-400 transition-colors">${card.title}</div>
            
            <div class="flex flex-wrap gap-2 items-center">
              ${dueBadge}
              ${chkBadge}
            </div>

            <div class="flex flex-wrap gap-1.5 pt-2 border-t border-slate-700/50">
              ${renderBadge('bg-purple-500/10 text-purple-300 border-purple-500/20', card.responsavel ? `Resp: ${card.responsavel}` : '')}
              ${renderBadge('bg-indigo-500/10 text-indigo-300 border-indigo-500/20', card.destino)}
              ${renderBadge('bg-emerald-500/10 text-emerald-300 border-emerald-500/20', card.projeto ? `Proj: ${card.projeto}` : '')}
              ${renderBadge('bg-sky-500/10 text-sky-300 border-sky-500/20', card.equipe)}
              ${renderBadge('bg-pink-500/10 text-pink-300 border-pink-500/20', card.cadastro_cartao ? `Cad: ${card.cadastro_cartao}` : '')}
              ${card.especificacao ? renderBadge('bg-emerald-500/20 text-emerald-300 border-emerald-500/30', '☑ Espec') : ''}
            </div>
          </div>
        </div>
      `;
    }

    async function createNewCard(colId) {
      const title = prompt("Nome do cartão (Ex: FILA SPEEDLITE TRS - COLEÇÃO):");
      if (!title) return;
      const { data } = await supabaseClient.from('kanban_cards').insert({
        column_id: colId, title, position: cards.length + 1
      }).select().single();
      if (data) {
        const colName = columns.find(c => c.id === colId)?.title || '';
        await logActivity(data.id, `adicionou este cartão a ${colName}`);
        loadAllData();
      }
    }

    async function addNewColumn() {
      const title = prompt("Nome da nova coluna:");
      if (!title) return;
      await supabaseClient.from('kanban_columns').insert({ title: title.toUpperCase(), position: columns.length + 1 });
      loadAllData();
    }

    async function openCardModal(cardId) {
      currentCardId = cardId;
      const card = cards.find(c => c.id === cardId);
      if (!card) return;

      const modal = document.getElementById('cardModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      const coverBox = document.getElementById('modalCoverContainer');
      if (card.cover_image_url) {
        coverBox.classList.remove('hidden');
        document.getElementById('modalCoverImg').src = card.cover_image_url;
        document.getElementById('modalCoverImgFront').src = card.cover_image_url;
      } else {
        coverBox.classList.add('hidden');
      }

      document.getElementById('modalTitle').value = card.title || '';
      document.getElementById('modalColumnName').innerText = columns.find(c => c.id === card.column_id)?.title || '';
      document.getElementById('modalCompleted').checked = !!card.is_completed;
      document.getElementById('modalDueDate').value = card.due_date ? card.due_date.slice(0, 16) : '';
      document.getElementById('modalDescription').value = card.description || '';

      document.getElementById('field_responsavel').value = card.responsavel || '';
      document.getElementById('field_destino').value = card.destino || '';
      document.getElementById('field_projeto').value = card.projeto || '';
      document.getElementById('field_acabamento').value = card.acabamento || '';
      document.getElementById('field_com_materiais').value = card.com_materiais || '';
      document.getElementById('field_pos_mol').value = card.pos_mol || '';
      document.getElementById('field_equipe').value = card.equipe || '';
      document.getElementById('field_cadastro_cartao').value = card.cadastro_cartao || '';
      document.getElementById('field_especificacao').checked = !!card.especificacao;

      document.getElementById('syncDataPreview').innerHTML = `
        <span class="text-slate-500">Resp:</span> <span class="text-purple-300 font-bold">${card.responsavel || '-'}</span> |
        <span class="text-slate-500">Destino:</span> <span class="text-indigo-300 font-bold">${card.destino || '-'}</span> |
        <span class="text-slate-500">Equipe:</span> <span class="text-sky-300 font-bold">${card.equipe || '-'}</span>
      `;

      renderModalChecklists(cardId);
      loadCardActivities(cardId);
    }

    function closeModal() {
      currentCardId = null;
      document.getElementById('cardModal').classList.add('hidden');
      document.getElementById('cardModal').classList.remove('flex');
    }

    async function saveCardField(field, value) {
      if (!currentCardId) return;
      await supabaseClient.from('kanban_cards').update({ [field]: value || null }).eq('id', currentCardId);
      await logActivity(currentCardId, `atualizou o campo ${field}`);
      loadAllData();
    }

    async function uploadCover(event) {
      const file = event.target.files[0];
      if (!file || !currentCardId) return;
      const fileName = `${currentCardId}_${Date.now()}_${file.name}`;
      const { error } = await supabaseClient.storage.from('anexos').upload(fileName, file);
      if (error) return alert("Erro no upload: " + error.message);
      const { data } = supabaseClient.storage.from('anexos').getPublicUrl(fileName);
      await saveCardField('cover_image_url', data.publicUrl);
    }

    function renderModalChecklists(cardId) {
      const container = document.getElementById('checklistsContainer');
      const cardChks = checklists.filter(c => c.card_id === cardId);
      container.innerHTML = cardChks.map(chk => {
        const items = checklistItems.filter(i => i.checklist_id === chk.id);
        const pct = items.length ? Math.round((items.filter(i => i.is_checked).length / items.length) * 100) : 0;
        return `
          <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-700/50">
            <div class="flex justify-between items-center mb-2">
              <span class="font-bold text-sm text-slate-200 flex items-center gap-2">
                <span>☑️</span> ${chk.title} <span class="text-xs text-slate-400 font-normal ml-1">${pct}%</span>
              </span>
              <button onclick="deleteChecklist('${chk.id}')" class="text-xs text-slate-500 hover:text-red-400 hover:underline transition-colors">Excluir</button>
            </div>
            <div class="w-full bg-slate-800 h-2 rounded-full mb-4 overflow-hidden border border-slate-700">
              <div class="bg-gradient-to-r from-emerald-500 to-emerald-400 h-full transition-all duration-500 ease-out" style="width:${pct}%"></div>
            </div>
            <div class="space-y-1.5 mb-3">
              ${items.map(item => `
                <label class="flex items-start gap-3 text-sm cursor-pointer hover:bg-slate-800 p-2 rounded-lg transition-colors group">
                  <input type="checkbox" ${item.is_checked ? 'checked' : ''} onchange="toggleChecklistItem('${item.id}', '${item.content}', this.checked)" class="mt-0.5 w-4 h-4 rounded border-slate-600 text-emerald-500 focus:ring-emerald-500/20 bg-slate-900 cursor-pointer" />
                  <span class="${item.is_checked ? 'line-through text-slate-500' : 'text-slate-300 group-hover:text-slate-200'} transition-colors leading-tight">${item.content}</span>
                </label>
              `).join('')}
            </div>
            <div class="flex gap-2">
              <input id="newItem_${chk.id}" type="text" placeholder="Adicionar um item..." 
                onkeydown="if(event.key==='Enter') addChecklistItem('${chk.id}')"
                class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-200 outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all placeholder-slate-500" />
              <button onclick="addChecklistItem('${chk.id}')" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm px-4 py-1.5 rounded-lg font-medium transition-colors">Add</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function createTemplateChecklist(type) {
      if (!currentCardId) return;
      const { data: chk } = await supabaseClient.from('card_checklists').insert({
        card_id: currentCardId, title: type
      }).select().single();
      if (type === 'CNC' && chk) {
        const grade = ['24/25 DIR - INF001','24/25 ESQ - INF002','26/27 DIR - INF003','26/27 ESQ - INF004','28/29 DIR - INF005','28/29 ESQ - INF006','30/31 DIR - INF007','30/31 ESQ - INF008','32/33 DIR - INF009','32/33 ESQ - INF010'];
        await supabaseClient.from('checklist_items').insert(grade.map((g, idx) => ({ checklist_id: chk.id, content: g, position: idx })));
      }
      loadAllData();
    }

    async function createCustomChecklist() {
      const title = prompt("Nome do Checklist (Ex: DADOS DE POSTIÇOS):");
      if (!title || !currentCardId) return;
      await supabaseClient.from('card_checklists').insert({ card_id: currentCardId, title: title.toUpperCase() });
      loadAllData();
    }

    async function addChecklistItem(chkId) {
      const input = document.getElementById(`newItem_${chkId}`);
      if (!input.value.trim()) return;
      await supabaseClient.from('checklist_items').insert({ checklist_id: chkId, content: input.value.trim() });
      input.value = '';
      loadAllData();
    }

    async function toggleChecklistItem(itemId, content, isChecked) {
      const user = document.getElementById('currentUser').value;
      await supabaseClient.from('checklist_items').update({ is_checked: isChecked, completed_by: user }).eq('id', itemId);
      await logActivity(currentCardId, `${isChecked ? 'concluiu' : 'desmarcou'} ${content} neste cartão`);
      loadAllData();
    }

    async function deleteChecklist(chkId) {
      await supabaseClient.from('card_checklists').delete().eq('id', chkId);
      loadAllData();
    }

    async function deleteCurrentCard() {
      if (!confirm("Tem certeza que deseja excluir este cartão?")) return;
      await supabaseClient.from('kanban_cards').delete().eq('id', currentCardId);
      closeModal();
      loadAllData();
    }

    async function logActivity(cardId, actionText, isComment = false) {
      const user = document.getElementById('currentUser').value;
      await supabaseClient.from('card_activities').insert({
        card_id: cardId, user_name: user, action_text: actionText, is_comment: isComment
      });
    }

    async function addComment() {
      const input = document.getElementById('commentInput');
      if (!input.value.trim() || !currentCardId) return;
      await logActivity(currentCardId, input.value.trim(), true);
      input.value = '';
      loadCardActivities(currentCardId);
    }

    async function loadCardActivities(cardId) {
      const { data } = await supabaseClient.from('card_activities').select('*').eq('card_id', cardId).order('created_at', { ascending: false });
      const container = document.getElementById('activitiesContainer');
      container.innerHTML = (data || []).map(act => `
        <div class="flex gap-3 relative pl-4 border-l-2 border-slate-800 py-1">
          <div class="absolute -left-[5px] top-2 w-2 h-2 rounded-full ${act.is_comment ? 'bg-brand-500 shadow-[0_0_8px_rgba(59,130,246,0.6)]' : 'bg-slate-600'}"></div>
          <div class="flex-1">
            <span class="font-bold text-slate-300 mr-1">${act.user_name}</span> 
            <span class="${act.is_comment ? 'block bg-slate-800 border border-slate-700/50 p-3 rounded-tr-xl rounded-b-xl mt-2 text-slate-200 shadow-sm leading-relaxed' : 'text-slate-400'}">${act.action_text}</span>
            <div class="text-[10px] font-medium text-slate-500 mt-1.5">${new Date(act.created_at).toLocaleString('pt-BR', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'})}</div>
          </div>
        </div>
      `).join('');
    }

    supabaseClient.channel('realtime-kanban')
      .on('postgres_changes', { event: '*', schema: 'public' }, () => loadAllData())
      .subscribe();

    loadAllData();
  </script>
</body>
</html>
